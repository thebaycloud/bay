[project]
name = "outreach-agent"
version = "0.1.0"
description = "Browser-Use agent that sources LinkedIn prospects into the outreach service"
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.13.6",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
outreach-agent = "outreach_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outreach_agent"]
