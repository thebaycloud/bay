<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
  <helmet>
  <style>
    /* shadcn neutral, light and dark. Geist because the repo already ships it
       and the panel already loads it — a direction picked here is native, not a
       retheme. Webfonts cannot load inside an artboard, so this falls back to
       system-ui in the mockup. */
    .r{--bg:#ffffff;--fg:#0a0a0a;--muted:#fafafa;--muted-2:#f5f5f5;--mfg:#737373;
       --border:#e5e5e5;--fill:#171717;--fill-fg:#fafafa;--live:#16a34a;--warn:#dc2626;
       --r:8px;--r-sm:6px;
       --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
       --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace}
    .r.dark{--bg:#0a0a0a;--fg:#fafafa;--muted:#171717;--muted-2:#1f1f1f;--mfg:#a1a1a1;
       --border:#262626;--fill:#fafafa;--fill-fg:#171717;--live:#22c55e;--warn:#ef4444}
    .r{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;
       line-height:1.45;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box;margin:0}
    body{margin:0}
    a{color:var(--fg)}a:hover{color:var(--mfg)}
    .m{font-family:var(--mono);font-size:12.5px}
    .sub{color:var(--mfg);font-size:13px}
    .lbl{color:var(--mfg);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
    .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
         border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);
         color:var(--fg);font:500 13px var(--sans);cursor:pointer}
    .btn:hover{background:var(--muted-2)}
    .btn-p{background:var(--fill);color:var(--fill-fg);border-color:var(--fill)}
    .dot{width:6px;height:6px;border-radius:50%;flex:none}
    .chev{color:var(--mfg);flex:none}
  </style>
  </helmet>
<div class="{{themeClass}}" style="width:860px;min-height:900px;display:flex">
  <div style="width:212px;flex:none;border-right:1px solid var(--border);background:var(--muted);display:flex;flex-direction:column;padding:12px 10px">
    <div style="display:flex;align-items:center;gap:9px;padding:6px 8px 14px">
      <div style="width:22px;height:22px;border-radius:6px;background:var(--fill);color:var(--fill-fg);display:grid;place-items:center;font:600 11px var(--mono)">l3</div>
      <div style="font-size:13.5px;font-weight:600;letter-spacing:-.01em">l3sgp</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:1px">
      <button style="display:flex;align-items:center;gap:9px;width:100%;text-align:left;border-radius:var(--r-sm);padding:7px 9px;cursor:pointer;font:500 13.5px var(--sans);color:inherit;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--border)">
        <span style="color:var(--mfg);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg></span>Analytics
      </button>
      <button style="display:flex;align-items:center;gap:9px;width:100%;text-align:left;border-radius:var(--r-sm);padding:7px 9px;cursor:pointer;font:500 13.5px var(--sans);color:inherit;background:transparent;border:1px solid transparent">
        <span style="color:var(--mfg);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6"/><path d="m5 9 7-3 7 3"/><path d="M4 14h16l-2 7H6z"/></svg></span>Ships
      </button>
      <button style="display:flex;align-items:center;gap:9px;width:100%;text-align:left;border-radius:var(--r-sm);padding:7px 9px;cursor:pointer;font:500 13.5px var(--sans);color:inherit;background:transparent;border:1px solid transparent">
        <span style="color:var(--mfg);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span>Data
      </button>
      <button style="display:flex;align-items:center;gap:9px;width:100%;text-align:left;border-radius:var(--r-sm);padding:7px 9px;cursor:pointer;font:500 13.5px var(--sans);color:inherit;background:transparent;border:1px solid transparent">
        <span style="color:var(--mfg);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2"/><path d="m16 4 3 3"/></svg></span>Keys
      </button>
      <button style="display:flex;align-items:center;gap:9px;width:100%;text-align:left;border-radius:var(--r-sm);padding:7px 9px;cursor:pointer;font:500 13.5px var(--sans);color:inherit;background:transparent;border:1px solid transparent">
        <span style="color:var(--mfg);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="7" x="3" y="3" rx="2"/><rect width="18" height="7" x="3" y="14" rx="2"/></svg></span>Infra
      </button>
      <button style="display:flex;align-items:center;gap:9px;width:100%;text-align:left;border-radius:var(--r-sm);padding:7px 9px;cursor:pointer;font:500 13.5px var(--sans);color:inherit;background:transparent;border:1px solid transparent">
        <span style="color:var(--mfg);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1"/><path d="M17 11a4 4 0 0 0 0-6"/></svg></span>Access
      </button>
      <button style="display:flex;align-items:center;gap:9px;width:100%;text-align:left;border-radius:var(--r-sm);padding:7px 9px;cursor:pointer;font:500 13.5px var(--sans);color:inherit;background:transparent;border:1px solid transparent">
        <span style="color:var(--mfg);display:flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="14" x="3" y="5" rx="2"/><path d="m7 10 2.5 2L7 14"/><path d="M12 14h5"/></svg></span>Agent
      </button>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg)">
        <span class="m" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px">l3sgp.supersonic.cv</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px;padding:0 4px 4px">
        <span class="dot" style="background:var(--live)"></span><span class="m">afloat</span>
      </div>
    </div>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 20px;border-bottom:1px solid var(--border)">
      <div style="font-size:15px;font-weight:600;letter-spacing:-.01em">Analytics</div>
      <div style="display:flex;gap:1px;padding:2px;background:var(--muted-2);border-radius:var(--r-sm)">
        <button class="btn" style="height:26px;border:0;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.05)">Today</button>
        <button class="btn" style="height:26px;border:0;background:transparent;color:var(--mfg)">7d</button>
        <button class="btn" style="height:26px;border:0;background:transparent;color:var(--mfg)">30d</button>
      </div>
    </div>
    <div style="padding:20px;display:flex;flex-direction:column;gap:16px">
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--border)">
        <div style="background:var(--bg);padding:14px 16px">
          <div style="font-size:22px;font-weight:600;letter-spacing:-.02em">2</div>
          <div class="sub" style="font-size:12.5px;margin-top:2px">visitors</div>
        </div>
        <div style="background:var(--bg);padding:14px 16px">
          <div style="font-size:22px;font-weight:600;letter-spacing:-.02em">39</div>
          <div class="sub" style="font-size:12.5px;margin-top:2px">pages opened</div>
        </div>
        <div style="background:var(--bg);padding:14px 16px">
          <div style="font-size:22px;font-weight:600;letter-spacing:-.02em">19m 10s</div>
          <div class="sub" style="font-size:12.5px;margin-top:2px">average visit</div>
        </div>
        <div style="background:var(--bg);padding:14px 16px">
          <div style="font-size:22px;font-weight:600;letter-spacing:-.02em">0%</div>
          <div class="sub" style="font-size:12.5px;margin-top:2px">bounced</div>
        </div>
      </div>
      <div style="border:1px solid var(--border);border-radius:var(--r);padding:16px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
          <div style="font-size:13.5px;font-weight:500">Over the window</div>
          <div class="sub" style="font-size:12px">1 on it right now</div>
        </div>
        <div style="display:flex;align-items:flex-end;gap:3px;height:88px">
          <div style="flex:1;height:4px;background:var(--fill);opacity:0.21;border-radius:2px"></div>
          <div style="flex:1;height:26px;background:var(--fill);opacity:0.37;border-radius:2px"></div>
          <div style="flex:1;height:50px;background:var(--fill);opacity:0.55;border-radius:2px"></div>
          <div style="flex:1;height:69px;background:var(--fill);opacity:0.68;border-radius:2px"></div>
          <div style="flex:1;height:79px;background:var(--fill);opacity:0.76;border-radius:2px"></div>
          <div style="flex:1;height:81px;background:var(--fill);opacity:0.77;border-radius:2px"></div>
          <div style="flex:1;height:74px;background:var(--fill);opacity:0.72;border-radius:2px"></div>
          <div style="flex:1;height:59px;background:var(--fill);opacity:0.61;border-radius:2px"></div>
          <div style="flex:1;height:37px;background:var(--fill);opacity:0.45;border-radius:2px"></div>
          <div style="flex:1;height:11px;background:var(--fill);opacity:0.26;border-radius:2px"></div>
          <div style="flex:1;height:15px;background:var(--fill);opacity:0.29;border-radius:2px"></div>
          <div style="flex:1;height:41px;background:var(--fill);opacity:0.48;border-radius:2px"></div>
          <div style="flex:1;height:62px;background:var(--fill);opacity:0.63;border-radius:2px"></div>
          <div style="flex:1;height:76px;background:var(--fill);opacity:0.74;border-radius:2px"></div>
          <div style="flex:1;height:81px;background:var(--fill);opacity:0.77;border-radius:2px"></div>
          <div style="flex:1;height:78px;background:var(--fill);opacity:0.75;border-radius:2px"></div>
          <div style="flex:1;height:66px;background:var(--fill);opacity:0.66;border-radius:2px"></div>
          <div style="flex:1;height:47px;background:var(--fill);opacity:0.52;border-radius:2px"></div>
          <div style="flex:1;height:22px;background:var(--fill);opacity:0.34;border-radius:2px"></div>
          <div style="flex:1;height:4px;background:var(--fill);opacity:0.21;border-radius:2px"></div>
          <div style="flex:1;height:30px;background:var(--fill);opacity:0.40;border-radius:2px"></div>
          <div style="flex:1;height:53px;background:var(--fill);opacity:0.57;border-radius:2px"></div>
          <div style="flex:1;height:71px;background:var(--fill);opacity:0.70;border-radius:2px"></div>
          <div style="flex:1;height:80px;background:var(--fill);opacity:0.77;border-radius:2px"></div>
        </div>
      </div>
      <div style="border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
        <div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:13.5px;font-weight:500">Most opened</div>
        <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)">
          <div style="flex:1;position:relative;height:24px;display:flex;align-items:center">
            <div style="position:absolute;inset:0 auto 0 0;width:100%;background:var(--muted-2);border-radius:4px"></div>
            <span class="m" style="position:relative;padding-left:8px">/</span>
          </div>
          <span class="m" style="color:var(--mfg)">2</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)">
          <div style="flex:1;position:relative;height:24px;display:flex;align-items:center">
            <div style="position:absolute;inset:0 auto 0 0;width:50%;background:var(--muted-2);border-radius:4px"></div>
            <span class="m" style="position:relative;padding-left:8px">/v</span>
          </div>
          <span class="m" style="color:var(--mfg)">1</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: this.props.dark ? 'r dark' : 'r' }; }
}
</script>
</body>
</html>
