<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
  <helmet>
  <style>
    /* shadcn neutral, light and dark. Geist because the repo already ships it
       and the panel already loads it — a direction picked here is native, not a
       retheme. Webfonts cannot load inside an artboard, so this falls back to
       system-ui in the mockup. */
    .r{--bg:#ffffff;--fg:#0a0a0a;--muted:#fafafa;--muted-2:#f5f5f5;--mfg:#737373;
       --border:#e5e5e5;--fill:#171717;--fill-fg:#fafafa;--live:#16a34a;--warn:#dc2626;
       --r:8px;--r-sm:6px;
       --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
       --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace}
    .r.dark{--bg:#0a0a0a;--fg:#fafafa;--muted:#171717;--muted-2:#1f1f1f;--mfg:#a1a1a1;
       --border:#262626;--fill:#fafafa;--fill-fg:#171717;--live:#22c55e;--warn:#ef4444}
    .r{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;
       line-height:1.45;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box;margin:0}
    body{margin:0}
    a{color:var(--fg)}a:hover{color:var(--mfg)}
    .m{font-family:var(--mono);font-size:12.5px}
    .sub{color:var(--mfg);font-size:13px}
    .lbl{color:var(--mfg);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
    .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
         border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);
         color:var(--fg);font:500 13px var(--sans);cursor:pointer}
    .btn:hover{background:var(--muted-2)}
    .btn-p{background:var(--fill);color:var(--fill-fg);border-color:var(--fill)}
    .dot{width:6px;height:6px;border-radius:50%;flex:none}
    .chev{color:var(--mfg);flex:none}
  </style>
  </helmet>
<div class="{{themeClass}}" style="width:640px;min-height:900px;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 20px;border-bottom:1px solid var(--border)">
    <div style="font-size:15px;font-weight:600;letter-spacing:-.01em">l3sgp</div>
    <div style="display:flex;align-items:center;gap:7px" class="sub">
      <span class="dot" style="background:var(--live)"></span><span class="m">afloat</span>
    </div>
  </div>
  <div style="padding:20px 20px 8px"><div class="lbl">Address</div></div>
  <div style="padding:0 20px 20px">
    <div style="display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--muted)">
      <span class="m" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">l3sgp.supersonic.cv</span>
      <button class="btn" style="height:26px;padding:0 8px;background:transparent;border:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect width="13" height="13" x="9" y="9" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
    </div>
  </div>
  <div style="padding:0 20px 8px"><div class="lbl">This app</div></div>
  <div style="display:flex;flex-direction:column;border-top:1px solid var(--border)">
    <button style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);padding:14px 20px;cursor:pointer;font-family:inherit;color:inherit">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:500">Analytics</div>
        <div class="sub" style="margin-top:2px">2 visitors today · 1 here now</div>
      </div>
       <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);padding:14px 20px;cursor:pointer;font-family:inherit;color:inherit">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:500">Ships</div>
        <div class="sub" style="margin-top:2px">Last shipped 4d ago</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--live)"></span><span class="m">Running</span></div> <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);padding:14px 20px;cursor:pointer;font-family:inherit;color:inherit">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:500">Data</div>
        <div class="sub" style="margin-top:2px">Its data and files</div>
      </div>
       <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);padding:14px 20px;cursor:pointer;font-family:inherit;color:inherit">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:500">Keys</div>
        <div class="sub" style="margin-top:2px">3 connected</div>
      </div>
       <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);padding:14px 20px;cursor:pointer;font-family:inherit;color:inherit">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:500">Infra</div>
        <div class="sub" style="margin-top:2px">Nothing running on its own</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--mfg)"></span><span class="m">quiet</span></div> <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border);padding:14px 20px;cursor:pointer;font-family:inherit;color:inherit">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:500">Access</div>
        <div class="sub" style="margin-top:2px">Private · 1 person</div>
      </div>
       <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
  <div style="padding:20px"><div class="lbl" style="margin-bottom:10px">Agent</div>
    <div class="sub" style="margin-bottom:12px">A token last reached us 1h ago.</div>
    <div style="display:flex;gap:8px"><button class="btn btn-p">Connect a tool</button><button class="btn">Tokens</button></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'r dark' : 'r' };
  }
}
</script>
</body>
</html>
