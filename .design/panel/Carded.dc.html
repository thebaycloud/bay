<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
  <helmet>
  <style>
    /* shadcn neutral, light and dark. Geist because the repo already ships it
       and the panel already loads it — a direction picked here is native, not a
       retheme. Webfonts cannot load inside an artboard, so this falls back to
       system-ui in the mockup. */
    .r{--bg:#ffffff;--fg:#0a0a0a;--muted:#fafafa;--muted-2:#f5f5f5;--mfg:#737373;
       --border:#e5e5e5;--fill:#171717;--fill-fg:#fafafa;--live:#16a34a;--warn:#dc2626;
       --r:8px;--r-sm:6px;
       --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
       --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace}
    .r.dark{--bg:#0a0a0a;--fg:#fafafa;--muted:#171717;--muted-2:#1f1f1f;--mfg:#a1a1a1;
       --border:#262626;--fill:#fafafa;--fill-fg:#171717;--live:#22c55e;--warn:#ef4444}
    .r{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;
       line-height:1.45;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box;margin:0}
    body{margin:0}
    a{color:var(--fg)}a:hover{color:var(--mfg)}
    .m{font-family:var(--mono);font-size:12.5px}
    .sub{color:var(--mfg);font-size:13px}
    .lbl{color:var(--mfg);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
    .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
         border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);
         color:var(--fg);font:500 13px var(--sans);cursor:pointer}
    .btn:hover{background:var(--muted-2)}
    .btn-p{background:var(--fill);color:var(--fill-fg);border-color:var(--fill)}
    .dot{width:6px;height:6px;border-radius:50%;flex:none}
    .chev{color:var(--mfg);flex:none}
  </style>
  </helmet>
<div class="{{themeClass}}" style="width:660px;min-height:900px;background:var(--muted);display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--bg)">
    <div style="font-size:15px;font-weight:600;letter-spacing:-.01em">l3sgp</div>
    <div style="display:flex;align-items:center;gap:7px"><span class="dot" style="background:var(--live)"></span><span class="m">afloat</span></div>
  </div>
  <div style="padding:18px;display:flex;flex-direction:column;gap:12px">
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
        <div><div style="font-size:14px;font-weight:600">Address</div><div class="sub" style="margin-top:1px">Where it lives</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--muted)">
        <span class="m" style="flex:1">l3sgp.supersonic.cv</span>
        <button class="btn" style="height:26px;padding:0 8px;border:0;background:transparent;color:var(--mfg)">Copy</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-height:126px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div><div style="font-size:14px;font-weight:600">Analytics</div><div class="sub" style="margin-top:2px">2 visitors today · 1 here now</div></div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--mfg)"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="margin-top:auto"><span class="m" style="color:var(--mfg)">39 opened</span></div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-height:126px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div><div style="font-size:14px;font-weight:600">Ships</div><div class="sub" style="margin-top:2px">Last shipped 4d ago</div></div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--mfg)"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="margin-top:auto"><div style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--live)"></span><span class="m">Running</span></div></div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-height:126px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div><div style="font-size:14px;font-weight:600">Data</div><div class="sub" style="margin-top:2px">Its data and files</div></div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--mfg)"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="margin-top:auto"><button class="btn" style="height:28px">Open</button></div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-height:126px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div><div style="font-size:14px;font-weight:600">Keys</div><div class="sub" style="margin-top:2px">3 connected</div></div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--mfg)"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="margin-top:auto"><span class="m" style="color:var(--mfg)">NEXTAUTH_URL +2</span></div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-height:126px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div><div style="font-size:14px;font-weight:600">Infra</div><div class="sub" style="margin-top:2px">Nothing runs on its own</div></div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--mfg)"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="margin-top:auto"><span class="m" style="color:var(--mfg)">quiet</span></div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-height:126px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
          <div><div style="font-size:14px;font-weight:600">Access</div><div class="sub" style="margin-top:2px">Private · 1 person</div></div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--mfg)"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div style="margin-top:auto"><div style="display:flex;align-items:center;gap:6px"><div style="width:22px;height:22px;border-radius:50%;background:var(--muted-2);border:1px solid var(--border);display:grid;place-items:center;font:500 10px var(--mono);color:var(--mfg)">IL</div><button class="btn" style="height:28px">Invite</button></div></div>
      </div>
    </div>
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:14px">
      <div style="flex:1"><div style="font-size:14px;font-weight:600">Agent</div>
        <div class="sub" style="margin-top:2px">A token last reached us 1h ago</div></div>
      <button class="btn">Tokens</button><button class="btn btn-p">Connect a tool</button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: this.props.dark ? 'r dark' : 'r' }; }
}
</script>
</body>
</html>
