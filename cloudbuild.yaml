# Deploy the control plane on every push to main.
#
# This replaces two commands that were run by hand every time, which meant deploys
# happened when someone remembered to do them and a fix could sit merged-but-dark
# for hours. No test or lint gate here on purpose — the point is that main reaches
# production, quickly and without ceremony.
#
# The image is tagged with the commit SHA, so the running revision can always be
# traced back to the code it came from, and `latest` moves with it for humans.

steps:
  # BuildKit with a registry cache: the image is a multi-stage Node build and a cold
  # build takes ~6 minutes, almost all of it npm install. mode=max caches the
  # intermediate stages too, so an unchanged dependency tree is restored instead of
  # reinstalled.
  - name: gcr.io/cloud-builders/docker
    id: build
    entrypoint: bash
    args:
      - -c
      - |
        docker buildx create --use --name ssbuilder --driver docker-container || true
        docker buildx build \
          --tag $_IMAGE:$_TAG \
          --tag $_IMAGE:latest \
          --build-arg NEXT_PUBLIC_PRODUCT_NAME=$_PRODUCT_NAME \
          --build-arg NEXT_PUBLIC_ROOT_DOMAINS=$_ROOT_DOMAINS \
          --cache-from type=registry,ref=$_IMAGE:cache \
          --cache-to type=registry,ref=$_IMAGE:cache,mode=max \
          --push \
          -f Dockerfile .

  # The deploy job runs the SAME image with a different command, so it has to move
  # with the service or a deploy from main would leave every actual deploy running
  # the previous commit's pipeline — the worst kind of drift, because the thing
  # that looks deployed is not the thing doing the work.
  #
  # Only --image, and the job's absence is the one failure this step is allowed
  # to shrug off: a fresh environment has no job yet (create or reconfigure it
  # with scripts/setup-deploy-job.sh). Everything else — a bad flag, a quota
  # error, an update that Cloud Run rejects — has to fail the build.
  #
  # That was not always true. This step used to run LAST, where a swallowed
  # failure just meant the job kept the previous commit's image for a while —
  # slow drift, caught whenever someone noticed. Now it runs FIRST, on purpose
  # (see the note below on ordering), which changes what the same swallow means:
  # a silently failed update now leaves the service going live on the new tag
  # while the job stays on the old one, and assertJobImageMatches then refuses
  # EVERY customer deploy until a human notices — the exact outage this step's
  # ordering exists to prevent, self-inflicted by the step itself.
  #
  # So existence and update-failure have to be told apart, and not by reading
  # the update's error text: gcloud's wording for "quota exceeded" or "bad flag"
  # is not a documented contract and can change under this pipeline without
  # warning. `gcloud run jobs describe` answering is the actual question —
  # does the job exist — asked directly instead of guessed at from a string.
  #
  # This runs BEFORE `deploy` below, and that order is load-bearing, not
  # cosmetic. Cloud Build runs steps in file order with no `waitFor` between
  # them, so for the seconds between these two steps one of the job and the
  # service is ahead of the other. assertJobImageMatches (apps/web/lib/
  # deploy-runs.ts) refuses to dispatch when they disagree — and if `deploy`
  # ran first, a service already on the new tag with a job still on the old
  # one is exactly the state it refuses on. Every customer deploy landing in
  # that window would 503 with "the job was not updated by the last deploy of
  # main", which at that moment would be false. Job-ahead-of-service is the
  # harmless direction: the job briefly carries code the service has not
  # started serving yet, which the guard has never objected to.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-job
    entrypoint: bash
    args:
      - -c
      - |
        if ! gcloud run jobs describe supersonic-deploy-job \
          --region=us-central1 --project=$PROJECT_ID --quiet >/dev/null 2>&1; then
          echo "no supersonic-deploy-job yet — skipping (see scripts/setup-deploy-job.sh)"
          exit 0
        fi
        gcloud run jobs update supersonic-deploy-job \
          --image=$_IMAGE:$_TAG --update-env-vars=$_LANE_ENV \
          --update-secrets=UMAMI_PASSWORD=umami-admin-password:latest \
          --region=us-central1 --project=$PROJECT_ID --quiet

  # The warm deploy worker is the same image again, with a third command, and it
  # moves here for the same reason the job does: a worker left on the previous
  # commit runs the previous commit's pipeline for every deploy that reaches it.
  #
  # Its drift guard is cheaper than the job's, and this step is what feeds it.
  # `assertJobImageMatches` asks the Cloud Run API for two images on every
  # dispatch; the worker instead compares IMAGE_TAG against the tag the
  # dispatcher sends, which costs nothing on a path this whole worker exists to
  # shorten. Both sides get the tag from here — the service below sets its own
  # in the same way — so "same commit" is a fact written once by the build
  # rather than asserted twice at runtime.
  #
  # Before `deploy` for the same ordering reason the job step gives: a worker
  # briefly ahead of the service is harmless, a worker behind it means every
  # dispatch is refused with 409 and silently falls back to the Job. That is a
  # slow deploy rather than an outage — the worker's refusal is always safe,
  # which is why this step may run without the elaborate
  # existence-versus-failure dance above and simply skip a worker that is not
  # there yet.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-worker
    entrypoint: bash
    args:
      - -c
      - |
        if ! gcloud run services describe supersonic-deploy-worker \
          --region=us-central1 --project=$PROJECT_ID --quiet >/dev/null 2>&1; then
          echo "no supersonic-deploy-worker yet — skipping (see scripts/setup-deploy-worker.sh)"
          exit 0
        fi
        # gen2 for the same reason the control-plane step below carries it, and
        # this service is why that note is not enough on its own: the worker runs
        # the same image, so it runs the planner and the repair agent, so it runs
        # Codex, so it needs the namespaces bubblewrap wants and gen1 does not
        # have. It was created without the flag and every command its agent ran
        # died on `bwrap: loopback: Failed RTM_NEWADDR: No child process`.
        # Repeated here rather than inherited because nothing inherits it — the
        # flag is set per service, by hand, in three unrelated places. Keep it
        # even though `gcloud run deploy` preserves the live value: this file is
        # what recreates the service after `setup-deploy-worker.sh` is rerun or
        # the service is deleted. See docs/HANDOFF-deploy-agent-sandbox.md.
        # UMAMI_PASSWORD, and it is here because of what its absence did.
        #
        # An app gets its analytics site from `createAppRecord`, which runs
        # wherever the deploy runs — the control plane, this worker, or the job.
        # Only the control plane was ever given UMAMI_URL and the password: these
        # two were configured by copying the control plane's environment ONCE,
        # before analytics existed, and a copy taken once is a copy that drifts.
        # So an app got analytics or did not according to which of three services
        # happened to deploy it, and the code returned in silence either way. Two
        # live apps had no site at all on 24 Aug and nothing anywhere said so.
        #
        # `--update-secrets` merges, exactly like --update-env-vars: the other
        # secrets this service carries are untouched.
        gcloud run deploy supersonic-deploy-worker \
          --image=$_IMAGE:$_TAG \
          --region=us-central1 --project=$PROJECT_ID \
          --execution-environment=gen2 \
          --update-env-vars=$_LANE_ENV \
          --update-env-vars=IMAGE_TAG=$_TAG \
          --update-secrets=UMAMI_PASSWORD=umami-admin-password:latest \
          --quiet

  # Never env vars: the live service carries AUTH_SECRET, PG_PASSWORD, the Stripe
  # keys and the lane flags, and a pipeline that passed --set-env-vars would wipe
  # them. Never --tag or --no-traffic either: a deploy from main is meant to serve,
  # and pinning traffic once already left a fix dark for half an hour.
  #
  # The resource flags DO belong here. They were applied by hand for months and
  # existed nowhere in the repo, so the settings that took the service down had no
  # source of truth to read: a deploy runs INSIDE this service's request handler
  # (clone + planner subprocess + gcloud), and at the old 2Gi/concurrency=160 four
  # concurrent deploys landed on one instance and OOM-killed it mid-build
  # ("Memory limit of 2048 MiB exceeded with 2092 MiB used", twice in one test run).
  #
  # concurrency=4 with 4Gi is ~1GB of headroom per concurrent deploy — 2x the
  # measured peak. Not concurrency=1: this service also serves the dashboard, env
  # sets, deploy-status and `logs --follow` polling every 2.5s, and giving each of
  # those its own cold Next.js instance trades an OOM for cold-start latency
  # everywhere. min-instances=1 keeps one warm so the common case never pays it.
  #
  # This is a STOPGAP. The real fix is moving deploy execution out of the request
  # into a Cloud Run Job, which also fixes the 600s maxDuration cap and scale-down
  # SIGTERM killing an in-flight deploy. Until that lands, these numbers are what
  # stands between a busy minute and a dead build.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - supersonic-control-plane
      - --image=$_IMAGE:$_TAG
      - --region=us-central1
      - --project=$PROJECT_ID
      - --memory=4Gi
      - --cpu=2
      - --concurrency=4
      - --min-instances=1
      # gen2, because chat runs Codex and Codex sandboxes itself with bubblewrap.
      #
      # On gen1 every command the agent ran died with
      # `bwrap: loopback: Failed RTM_NEWADDR: No child process` — bubblewrap could not
      # create its network namespace, so nothing executed: not the tools, not even a
      # `sed` on a file in its own workspace. The agent reported "the analytics tool
      # failed to run" and it was right about every tool it had.
      #
      # gen2 runs a real kernel with the namespaces bubblewrap needs. This is the fix
      # that KEEPS the sandbox: the alternative is --sandbox danger-full-access, which
      # would hand the agent's shell the network back, and no network is the whole
      # reason a prompt injected through an app's own database rows cannot leave with
      # anything. See lib/chat/bridge.ts.
      - --execution-environment=gen2
      # The lane flags. These select WHICH PIPELINE RUNS — whether server apps go
      # to the prebuilt runner, whether the model planner is consulted, whether
      # apps are sealed behind the proxy, which engine repairs a failed deploy,
      # and whether execution moves to the Cloud Run Job. Until now they existed
      # nowhere in the repo: they were typed by hand at the live service, so the
      # code path a deploy actually took could not be read from the commit that
      # was running. That is the same failure the resource flags above already
      # have a paragraph about, applied to something strictly worse — the
      # resource flags decide how well the pipeline runs, these decide which
      # pipeline it is. A cutover you cannot reason about is a cutover you
      # cannot roll back, and Phase 3 of docs/DEPLOY-PLAN.md runs two pipelines
      # side by side.
      #
      # --update-env-vars, never --set-env-vars, for exactly the reason the note
      # above gives: the live service also carries AUTH_SECRET, PG_PASSWORD and
      # the Stripe keys, and --set would wipe every one of them. These values
      # were read back off the running revision, so this commit records what
      # production already does rather than changing it.
      #
      # BUILDER, BUILDKIT_IMAGE and DOCKER_MIRROR were added after a measured
      # canary, not on the strength of the argument for them. The canary built
      # the config `buildkitBuildConfig` actually generates, against the mirror,
      # twice: cold 44s, warm 15s, with `inferred cache manifest type` and four
      # CACHED layers on the second — so `--push`, `--cache-to` and `--cache-from`
      # all authenticate. docs/CUTOVER.md:369-378 called that unverified and
      # warned it would be "total failure of the lane, not a degraded cache",
      # which is why it was worth one throwaway build to find out.
      #
      # NODE_IDENTITY=enforce, added 12 Aug once every node was seen sending a
      # signed identity. Until then the broker AUDITED: a request with no
      # instance identity token was allowed and logged, because nodes collect a
      # new agent on their own two-minute timer and refusing early would have
      # taken secrets from every node that had not updated.
      #
      # Audit mode protects nothing on its own — it observes. `enforce` is what
      # makes the per-node claim real: without it a caller holding the shared
      # FLEET_TOKEN can simply omit the header and be allowed.
      #
      # The evidence for flipping it: fleet-lab-2 was the last node to update, at
      # 13:13, and its crons at 13:20 resolved their secrets with no audit line
      # logged for that window. A mismatched identity was ALWAYS refused, in
      # either mode — audit was only ever about absence.
      #
      # BUILDER=railpack AND BUILDKIT_HOST, added 12 Aug, and the pair is the
      # point: Railpack writes the plan, and the plan is executed on the
      # long-lived BuildKit at that address rather than on a Cloud Build worker
      # that starts cold and downloads its cache in full. Either alone does
      # nothing useful — the plan needs somewhere warm to run, and the daemon
      # needs a plan to run.
      #
      # THIS FILE IS WHY THEY ARE HERE AND NOT SET BY HAND. `_LANE_ENV` is
      # reapplied to the job, the worker and the service on every control-plane
      # deploy, so anything set with `gcloud run jobs update` survives exactly
      # until the next one. A Railpack canary was set that way on 12 Aug, worked,
      # and was silently reverted by the next deploy — the build went back to
      # Cloud Build and the log said so to nobody. Intent belongs in the commit.
      #
      # BUILDER is not optional any more, which is the part that changed. Kaniko
      # has no `--mount=type=secret`; its only channel for a build-time value is
      # `--build-arg`, whose values are readable in the history of an image that
      # is pushed to a shared repository and deleted by nothing. So the build
      # secrets that Prisma needs cannot exist on kaniko at all, and the runner —
      # the only build path that ever mounted one — is the thing being deleted.
      #
      # DOCKER_MIRROR points every generated `FROM` at a pull-through cache of
      # Docker Hub, so builds stop making anonymous Hub pulls from a shared GCP
      # NAT range. Invisible at today's volume; intermittent build failures at
      # launch volume, which look like broken apps and reach the repair agent.
      #
      # Roll back with --update-env-vars=BUILDER=kaniko. The mirror and the
      # daemon image are safe to leave either way.
      - --update-env-vars=$_LANE_ENV
      # The commit this revision is, so the dispatcher can tell the warm worker
      # which pipeline it is asking for. Absent on either side means "cannot
      # compare" and the worker accepts the deploy — the same fail-open rule
      # assertJobImageMatches states, for the same reason: this check exists to
      # catch a stale worker, not to become a fresh way for a deploy to fail.
      - --update-env-vars=IMAGE_TAG=$_TAG
      # Set by hand on this service in July and by nothing since. Written down
      # here for the same reason as the worker's: three services read it and one
      # of them having it is indistinguishable, from the outside, from all three.
      - --update-secrets=UMAMI_PASSWORD=umami-admin-password:latest
      - --quiet

substitutions:
  # The flags that select WHICH PIPELINE RUNS, in one place because they have to
  # reach TWO.
  #
  # The job step used to update only `--image`, so every variable set here landed
  # on the service and never on the job — and `DEPLOY_JOB=1` means the job is
  # where deploys actually execute. A flag written in this file was therefore not
  # a description of what deploys do; it described what the service would have
  # done if it were still doing them. Found by setting CLOUD_BUILD_RUN_AS here,
  # deploying, and watching a build come out as the old identity anyway.
  #
  # `scripts/setup-deploy-job.sh` copies the service's env onto the job, which is
  # why this ever appeared to work — but that script is run by hand, and CI is
  # not.
  #
  # FLEET_APPS, FLEET_PLACEMENT AND RUNNER ARE GONE, and the deletion of the
  # Cloud Run container lane is what removed them. A canary list decides which
  # apps take a different runtime from the rest; with one runtime there is no
  # "the rest", and `fleetPlacementWanted` — the only reader — went with the lane.
  #
  # It is worth keeping the record of what this list cost, because the shape
  # recurs. It named `i6xce,gzz9j` until 6 Aug while both apps had been deleted in
  # the 5 Aug cleanup, so no deploy could reach the fleet through it at all — and
  # a canary list naming deleted apps is indistinguishable from one that works
  # until somebody checks. Worse, it was set in two places that disagreed: the
  # control plane had FLEET_APPS and no FLEET_PLACEMENT while the deploy worker
  # had both, so the same app landed on a DIFFERENT RUNTIME depending on which
  # service happened to run its deploy.
  #
  # RUNNER=0 selected the generated-image path over the prebuilt runner. The
  # runner lane is deleted; every app builds an image of its own now.
  #
  # `^~~^` is gcloud's own escape for "this list is separated by ~~, not by
  # commas". It was needed because FLEET_APPS was a comma-separated list ITSELF,
  # and it stays because it costs nothing and the next such value will need it.
  # Written the obvious way, `FLEET_APPS=i6xce,p6mx8` ends the value at the
  # comma and `p6mx8` becomes a malformed variable name — the second canary
  # would silently not exist, and every flag after it would shift. The same
  # escape is already used by gcloud.ts:368 and :696 for exactly this reason.
  # FLEET_APPS was `i6xce,gzz9j` until 6 Aug and had been pointing at nothing for a
  # day: both apps were deleted in the 5 Aug cleanup, so no deploy could reach the
  # fleet through this list at all. Worth stating because the list looked healthy —
  # two entries, both described at length above — and a canary list naming deleted
  # apps is indistinguishable from one that works until somebody checks.
  #
  # `q6doa` is examples/shapes/plainweb, deployed for one purpose: the node now
  # records how long it spends pulling an image and booting a sandbox
  # (`fleet-pull`, `fleet-boot`), and nothing had exercised that path since it
  # shipped. Those two numbers gate the decision between shrinking the image and
  # precompiling the entry point, so they are measured before that work starts
  # rather than after — see docs/superpowers/specs/2026-08-06-fastest-first-deploy-design.md.
  #
  # Ours, throwaway, and its downtime belongs to nobody, which is the same reason
  # the entries it replaces were chosen.
  _LANE_ENV: ^~~^PLANNER=1~~SEAL_APPS=1~~DEPLOY_ENGINE=opencode~~DEPLOY_JOB=1~~NODE_IDENTITY=enforce~~BUILDER=railpack~~BUILDKIT_HOST=tcp://10.128.0.5:1234~~BUILDKIT_IMAGE=us-central1-docker.pkg.dev/supersonic-deploy-prod/docker-hub/moby/buildkit:buildx-stable-1~~DOCKER_MIRROR=us-central1-docker.pkg.dev/supersonic-deploy-prod/docker-hub~~CLOUD_BUILD_RUN_AS=supersonic-build@supersonic-deploy-prod.iam.gserviceaccount.com~~UMAMI_URL=https://supersonic-umami-uyuwsbguuq-uc.a.run.app~~UMAMI_USER=admin
  _IMAGE: us-central1-docker.pkg.dev/supersonic-deploy-prod/supersonic/control-plane
  # The commit being deployed. A trigger passes $SHORT_SHA; a manual `builds submit`
  # passes whatever it likes. The default keeps a hand-run build from failing on an
  # unset substitution — it is never what lands from main.
  _TAG: manual
  # The brand, baked into the client bundle. Next inlines NEXT_PUBLIC_* at build
  # time and strips everything else, so these cannot be Cloud Run env vars: the
  # dashboard's own header would keep saying the old name while every
  # server-rendered link used the new one.
  #
  # ORDER IS MEANING in _ROOT_DOMAINS — the first root is canonical. See
  # apps/web/lib/roots.ts.
  #
  # `--build-arg` is warned about above, and the warning is about SECRETS: those
  # values stay readable in the history of an image pushed to a shared
  # repository. A product name and a domain are printed on the page they build,
  # so there is nothing here to leak.
  _PRODUCT_NAME: Bay
  _ROOT_DOMAINS: thebay.cloud,supersonic.cv

# THE BUILD RUNS AS THE DEPLOYER, NOT AS THE DEFAULT COMPUTE ACCOUNT.
#
# Added 12 Aug, after that default account was narrowed for a different reason
# and this build broke on both halves of what it does: first `denied:
# artifactregistry.repositories.uploadArtifacts` on the push, then
# `PERMISSION_DENIED: run.services.get` on the deploy.
#
# The tension is real and worth naming rather than papering over. That account is
# the DEFAULT COMPUTE one, which makes it two things at once: the identity of
# every fleet node — machines whose whole job is running other people's code —
# and, by default, the identity Cloud Build executes as. Giving it back
# `run.admin` so this file can deploy would mean a sandbox escape can delete
# every Cloud Run service in the project. Naming a different account here is how
# the two stop being one.
#
# `supersonic-deployer@` already holds exactly what a platform deploy needs, and
# CI already authenticates as it — so this makes the build run as the identity
# that submitted it, rather than as whatever the project happens to default to.
#
# `logging: CLOUD_LOGGING_ONLY` below is a PRECONDITION, not decoration: Cloud
# Build refuses a user-specified service account unless a logging destination is
# set, because such a build has no default bucket to write to.
serviceAccount: projects/supersonic-deploy-prod/serviceAccounts/supersonic-deployer@supersonic-deploy-prod.iam.gserviceaccount.com

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
