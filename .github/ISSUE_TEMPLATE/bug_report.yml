name: Bug report
description: Something on thebay.cloud, or in the bay CLI, does not do what it says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        If this is a security problem — one app reaching another's data, escaping
        the sandbox, or acting as somebody else's account — **stop and use
        [private reporting](https://github.com/thebaycloud/bay/security/advisories/new)
        instead.** See SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What you ran
      description: The command, the page, or the request. Verbatim beats paraphrased.
      placeholder: bay ship
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: input
    id: handle
    attributes:
      label: App slug or deploy id
      description: >
        If this happened on thebay.cloud, this is the single most useful field on
        the form — it is the handle that finds the logs. Skip it if the problem is
        local.
      placeholder: z1b3k, or a deploy id from the dashboard
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: CLI version, if the CLI was involved
      description: "`bay --version`"
    validations:
      required: false
