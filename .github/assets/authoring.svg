<svg xmlns="http://www.w3.org/2000/svg" width="900" height="517" viewBox="0 0 900 517" role="img" aria-label="bay init then bay check: the two-second local loop, no cloud touched">
<style>
  .l{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;
     opacity:0;animation-duration:12.9s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
  .c-cmd{fill:#eef3ef;font-weight:600}
  .c-hot{fill:#d9a441} .c-key{fill:#8fd3ad} .c-dim{fill:#93a29a}
  .c-cut{fill:#5f6d65;font-style:italic} .c-ok{fill:#57d68d;font-weight:600}
  .cur{animation:cur2 12.9s infinite steps(1,end),blink2 1.06s infinite steps(1,end)}
  @keyframes blink2{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  @keyframes q0{0%,0.000%{opacity:0}0.400%,100%{opacity:1}}
@keyframes q1{0%,3.876%{opacity:0}4.276%,100%{opacity:1}}
@keyframes q2{0%,7.752%{opacity:0}8.152%,100%{opacity:1}}
@keyframes q3{0%,11.628%{opacity:0}12.028%,100%{opacity:1}}
@keyframes q4{0%,15.504%{opacity:0}15.904%,100%{opacity:1}}
@keyframes q5{0%,19.380%{opacity:0}19.780%,100%{opacity:1}}
@keyframes q6{0%,23.256%{opacity:0}23.656%,100%{opacity:1}}
@keyframes q7{0%,27.132%{opacity:0}27.532%,100%{opacity:1}}
@keyframes q8{0%,31.008%{opacity:0}31.408%,100%{opacity:1}}
@keyframes q9{0%,34.884%{opacity:0}35.284%,100%{opacity:1}}
@keyframes q10{0%,38.760%{opacity:0}39.160%,100%{opacity:1}}
@keyframes q11{0%,42.636%{opacity:0}43.036%,100%{opacity:1}}
@keyframes q12{0%,46.512%{opacity:0}46.912%,100%{opacity:1}}
@keyframes q13{0%,50.388%{opacity:0}50.788%,100%{opacity:1}}
@keyframes q14{0%,54.264%{opacity:0}54.664%,100%{opacity:1}}
@keyframes q15{0%,58.140%{opacity:0}58.540%,100%{opacity:1}}
@keyframes q16{0%,62.016%{opacity:0}62.416%,100%{opacity:1}}
@keyframes q17{0%,65.891%{opacity:0}66.291%,100%{opacity:1}}
@keyframes q18{0%,69.767%{opacity:0}70.167%,100%{opacity:1}}
@keyframes cur2{0%,73.643%{opacity:0}73.643%,100%{opacity:1}}

</style>
<rect width="900" height="517" rx="7" fill="#0d1512"/>
<rect x="0.5" y="0.5" width="899" height="516" rx="6.5" fill="none" stroke="#26332c"/>
<path d="M0 32 H900" stroke="#1d2823"/>
<circle cx="20" cy="17" r="4.5" fill="#3a4640"/><circle cx="36" cy="17" r="4.5" fill="#3a4640"/><circle cx="52" cy="17" r="4.5" fill="#3a4640"/>
<text x="450" y="21.5" text-anchor="middle" class="l" style="opacity:.55;animation:none;fill:#93a29a;font-size:11.5px;letter-spacing:.08em">local · ~2s · no cloud</text>
<text x="22" y="52" class="l c-cmd" style="animation-name:q0">$ bay init</text>
<text x="22" y="75" class="l c-key" style="animation-name:q1">Wrote supersonic.json — 1 service detected.</text>
<text x="22" y="98" class="l c-dim" style="animation-name:q2">  /   app   node   npm start</text>
<text x="22" y="121" class="l c-hot" style="animation-name:q3">Two things I could not determine — check them:</text>
<text x="22" y="144" class="l c-dim" style="animation-name:q4">  · does `app` need a migration before traffic?  (release: …)</text>
<text x="22" y="167" class="l c-dim" style="animation-name:q5">  · which secrets does it read?                  (secrets: [])</text>
<text x="22" y="190" class="l c-cut" style="animation-name:q6">This is a draft, from a detector that has been confidently wrong before.</text>
<text x="22" y="236" class="l c-cmd" style="animation-name:q8">$ bay check</text>
<text x="22" y="259" class="l c-key" style="animation-name:q9">supersonic.json — 1 service, provisions postgres</text>
<text x="22" y="282" class="l c-dim" style="animation-name:q10">  app  ·  container lane  ·  /</text>
<text x="22" y="305" class="l c-dim" style="animation-name:q11">    runtime   node22</text>
<text x="22" y="328" class="l c-dim" style="animation-name:q12">    base      node:22  ·  package.json engines.node</text>
<text x="22" y="351" class="l c-dim" style="animation-name:q13">    install   npm install</text>
<text x="22" y="374" class="l c-dim" style="animation-name:q14">    release   —  (nothing runs before traffic)</text>
<text x="22" y="397" class="l c-dim" style="animation-name:q15">    start     npm start</text>
<text x="22" y="420" class="l c-dim" style="animation-name:q16">    health    GET / → 200</text>
<text x="22" y="443" class="l c-key" style="animation-name:q17">    uses      database</text>
<text x="22" y="466" class="l c-ok" style="animation-name:q18">✓ nothing here fails before the build. No GCP was touched.</text>

<text x="22" y="489" class="l c-cmd cur">$ █</text>
</svg>
