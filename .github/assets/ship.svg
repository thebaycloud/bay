<svg xmlns="http://www.w3.org/2000/svg" width="900" height="517" viewBox="0 0 900 517" role="img" aria-label="bay ship --wait: a real deploy, from upload to a live URL">
<style>
  .l{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;
     opacity:0;animation-duration:14.98s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
  .c-cmd{fill:#eef3ef;font-weight:600}
  .c-hot{fill:#d9a441} .c-key{fill:#8fd3ad} .c-dim{fill:#93a29a}
  .c-cut{fill:#5f6d65;font-style:italic} .c-ok{fill:#57d68d;font-weight:600}
  .cur{animation:cur 14.98s infinite steps(1,end),blink 1.06s infinite steps(1,end)}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  @keyframes r0{0%,0.000%{opacity:0}0.400%,100%{opacity:1}}
@keyframes r1{0%,4.139%{opacity:0}4.539%,100%{opacity:1}}
@keyframes r2{0%,8.278%{opacity:0}8.678%,100%{opacity:1}}
@keyframes r3{0%,12.417%{opacity:0}12.817%,100%{opacity:1}}
@keyframes r4{0%,16.555%{opacity:0}16.955%,100%{opacity:1}}
@keyframes r5{0%,20.694%{opacity:0}21.094%,100%{opacity:1}}
@keyframes r6{0%,24.833%{opacity:0}25.233%,100%{opacity:1}}
@keyframes r7{0%,28.972%{opacity:0}29.372%,100%{opacity:1}}
@keyframes r8{0%,33.111%{opacity:0}33.511%,100%{opacity:1}}
@keyframes r9{0%,37.250%{opacity:0}37.650%,100%{opacity:1}}
@keyframes r10{0%,41.389%{opacity:0}41.789%,100%{opacity:1}}
@keyframes r11{0%,45.527%{opacity:0}45.927%,100%{opacity:1}}
@keyframes r12{0%,49.666%{opacity:0}50.066%,100%{opacity:1}}
@keyframes r13{0%,53.805%{opacity:0}54.205%,100%{opacity:1}}
@keyframes r14{0%,57.944%{opacity:0}58.344%,100%{opacity:1}}
@keyframes r15{0%,62.083%{opacity:0}62.483%,100%{opacity:1}}
@keyframes r16{0%,66.222%{opacity:0}66.622%,100%{opacity:1}}
@keyframes r17{0%,70.360%{opacity:0}70.760%,100%{opacity:1}}
@keyframes r18{0%,74.499%{opacity:0}74.899%,100%{opacity:1}}
@keyframes cur{0%,78.638%{opacity:0}78.638%,100%{opacity:1}}

</style>
<rect width="900" height="517" rx="7" fill="#0d1512"/>
<rect x="0.5" y="0.5" width="899" height="516" rx="6.5" fill="none" stroke="#26332c"/>
<path d="M0 32 H900" stroke="#1d2823"/>
<circle cx="20" cy="17" r="4.5" fill="#3a4640"/><circle cx="36" cy="17" r="4.5" fill="#3a4640"/><circle cx="52" cy="17" r="4.5" fill="#3a4640"/>
<text x="450" y="21.5" text-anchor="middle" class="l" style="opacity:.55;animation:none;fill:#93a29a;font-size:11.5px;letter-spacing:.08em">demo-pgapp — bay</text>
<text x="22" y="52" class="l c-cmd" style="animation-name:r0">$ bay ship --wait</text>
<text x="22" y="75" class="l c-hot" style="animation-name:r1">⧗ shipping — your app will be live at https://xf4u7.thebay.cloud</text>
<text x="22" y="98" class="l c-hot" style="animation-name:r2">▸ uploading demo-pgapp…</text>
<text x="22" y="121" class="l c-dim" style="animation-name:r3">  no git repository here — packing the folder minus the usual build junk</text>
<text x="22" y="144" class="l c-dim" style="animation-name:r4">  Detecting stack…</text>
<text x="22" y="167" class="l c-key" style="animation-name:r5">  Detected Node · JavaScript (60%)</text>
<text x="22" y="190" class="l c-key" style="animation-name:r6">  Provision postgres (via pg)</text>
<text x="22" y="213" class="l c-dim" style="animation-name:r7">  Plan ready: supersonic.json (app)</text>
<text x="22" y="236" class="l c-dim" style="animation-name:r8">  Building an image on node 22 — package.json engines.node.</text>
<text x="22" y="259" class="l c-key" style="animation-name:r9">  Provisioning Postgres…</text>
<text x="22" y="282" class="l c-key" style="animation-name:r10">  Provisioned Postgres database xf4u7</text>
<text x="22" y="305" class="l c-dim" style="animation-name:r11">  Database isolated — this app connects as app_xf4u7 and no other app can reach it</text>
<text x="22" y="328" class="l c-dim" style="animation-name:r12">  Stored DATABASE_URL, POSTGRES_PASSWORD, PGPASSWORD… in Secret Manager</text>
<text x="22" y="351" class="l c-key" style="animation-name:r13">  Deploying xf4u7 to the fleet…</text>
<text x="22" y="374" class="l c-dim" style="animation-name:r14">  Building on the fleet's own BuildKit — its cache is local and stays warm…</text>
<text x="22" y="397" class="l c-cut" style="animation-name:r15">  … 20 BuildKit lines, all CACHED …</text>
<text x="22" y="420" class="l c-dim" style="animation-name:r16">  Built sha256:da8ae063698b… — deployed by digest, so "the new version" is a fact</text>
<text x="22" y="443" class="l c-dim" style="animation-name:r17">  Running on fleet-lab-3</text>
<text x="22" y="466" class="l c-ok" style="animation-name:r18">✓ live: https://xf4u7.thebay.cloud</text>

<text x="22" y="489" class="l c-cmd cur">$ █</text>
</svg>
