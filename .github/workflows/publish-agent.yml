# Push to main → the fleet agent is built and published for the nodes to collect.
#
# The agent is the last component with no deploy path. It has been updated by
# copying .go files to each node and building there, which means "merged" and
# "running" have been different questions for as long as it has existed —
# ADR 0002 routed the room around that gap a year ago, and the fleet-pull and
# fleet-boot stages shipped, wrote zero rows, and looked like broken
# instrumentation because of it.
#
# This publishes. Collection is the node's job (image/update-agent.sh), on the
# same pull-not-push principle as desired state: nothing reaches into a node.
name: Publish fleet agent

on:
  push:
    branches: [main]
    paths:
      - "services/fleet/agent/**"
      - ".github/workflows/publish-agent.yml"
  workflow_dispatch:

# Never two publishes at once. The pointer is a single object and the last
# writer wins; two concurrent runs could leave it naming the older build.
concurrency:
  group: publish-agent
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the OIDC token; without it auth fails
  actions: read # `gh run list` reads the control-plane run this publish waits on

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/fleet/agent/go.sum

      # The agent's own tests gate the release. They are fast and they cover the
      # reconcile loop, adoption and the backoff trackers — the three things a
      # bad agent breaks quietly rather than loudly.
      - name: Test
        working-directory: services/fleet/agent
        run: go test ./...

      # CGO off and a static binary, because the node it lands on is not this
      # runner and must not need a matching libc.
      - name: Build
        working-directory: services/fleet/agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_SHA::7}" -o supersonicd .
          ./supersonicd -version || { echo "the binary does not run"; exit 1; }

      # The control plane goes first. ALWAYS.
      #
      # WHY, from a real incident on 2026-08-11 22:44. The secret broker landed
      # as two commits' worth of one change: a route on the control plane and an
      # agent that calls it. Both workflows trigger on `push: main`
      # independently, the agent's build is much faster than a Next.js deploy,
      # and every node collects a new agent within two minutes
      # (supersonic-update-agent.timer). So the agent arrived first, called a
      # route that did not exist yet, and three apps failed their release with
      # `secret broker refused ...: 404 <!DOCTYPE html>` — the Next.js shell,
      # served because the path was not a route yet. They recovered on retry.
      #
      # This is not specific to the broker. Any agent change that depends on a
      # new control-plane behaviour has the same window, and the node's two
      # minute timer means the window is always open.
      #
      # The dependency is one-directional and stays that way: an OLD agent must
      # keep working against a NEW control plane, which is what the absent-vs-
      # empty discipline on the wire is for. It is only the other order that
      # needs a gate.
      #
      # A failed control-plane deploy blocks the agent publish, including for an
      # unrelated agent fix. That is the safe direction of the trade: the cost is
      # a delayed agent, and the alternative cost is an agent talking to a
      # control plane that was never there.
      - name: Wait for the control plane at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            # Filtered by COMMIT, not by "the latest run". Taking the most recent
            # run right after a push returns the PREVIOUS one, which reads as a
            # green light from a build that knows nothing about this commit.
            CONCLUSION="$(gh run list --commit "$GITHUB_SHA" --workflow "Deploy control plane" \
              --limit 1 --json conclusion --jq '.[0].conclusion // empty' || true)"
            case "$CONCLUSION" in
              success)
                echo "the control plane at ${GITHUB_SHA::7} is live; publishing the agent"
                exit 0 ;;
              failure|cancelled|timed_out)
                echo "the control plane at ${GITHUB_SHA::7} ended in '$CONCLUSION' —"
                echo "refusing to publish an agent that may need it."
                exit 1 ;;
            esac
            sleep 20
          done
          echo "the control plane at ${GITHUB_SHA::7} did not finish within 20 minutes"
          exit 1

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/540236122367/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: supersonic-deployer@supersonic-deploy-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Content-addressed, then the pointer. In that order and never the reverse:
      # a pointer naming an object that is not there yet is a node that downloads
      # a 404 and, if the updater were less careful, installs it.
      - name: Publish
        working-directory: services/fleet/agent
        run: |
          set -euo pipefail
          DIGEST="$(sha256sum supersonicd | cut -d' ' -f1)"
          echo "sha256 $DIGEST"

          gcloud storage cp supersonicd \
            "gs://supersonic-static-assets/agent/$DIGEST/supersonicd" \
            --project supersonic-deploy-prod

          # STAGED, and the third line is what stages it: the percentage of the
          # fleet that should be running this build. `update-agent.sh` has each
          # node decide for itself from a hash of its own name and this digest,
          # so there is no list to keep in step with reality and a node reaches
          # the same answer on every tick.
          #
          # 34 is ABOUT one node of three — an expectation, not a count. The node
          # decides by hashing its own name with this digest, so the hash is free
          # to put none or two of them under the threshold, and it put two on the
          # second live rollout. That is the bargain: no coordination, in exchange
          # for a number that is only exact in the aggregate.
          #
          # It is still the smallest blast radius this fleet can express, and it
          # is what would have caught both of the things it replaces — a change
          # reaching every node inside two minutes, twice in one day, with nothing
          # in between to notice.
          #
          # Promoted to 100 by the step below, once a node has actually reported
          # running it. An agent that is never confirmed stays on one node.
          printf '%s\n%s\n34\n' "$DIGEST" "$GITHUB_SHA" > current
          gcloud storage cp current \
            "gs://supersonic-static-assets/agent/current" \
            --cache-control="no-cache" \
            --project supersonic-deploy-prod
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      # Promote to the whole fleet, but only once a node has actually run it.
      #
      # WITHOUT THIS THE STAGING IS WORSE THAN NOTHING: 34% would leave two nodes
      # of three on the previous build indefinitely, which is a split fleet
      # nobody asked for. The promotion is what makes a staged publish a rollout
      # rather than a fork.
      #
      # The signal is the node's own word. `main.Version` is the short commit sha
      # and the agent sends it on every sync, so a row in `fleet_nodes` carrying
      # this build is proof that a real machine downloaded it, started it, and
      # got far enough to talk back. Nothing here checks that the apps on it are
      # healthy — that is what the ten minutes of soak are for, and what a human
      # watching a canary would look at.
      #
      # If no node picks it up, this FAILS rather than promoting anyway. A fleet
      # left at 34% is visible and recoverable; a bad agent on every node is the
      # thing this whole mechanism exists to prevent.
      - name: Promote the rollout once a node is running it
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"

          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5433 supersonic-deploy-prod:us-central1:supersonic-platform-pg &
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/5433) 2>/dev/null && break
            sleep 1
          done

          PGPASSWORD="$(gcloud secrets versions access latest \
            --secret supersonic-pg-password --project supersonic-deploy-prod)"
          export PGPASSWORD

          # Nodes collect on their own two-minute timer, so this waits long
          # enough for two attempts and no longer.
          ok=0
          for i in $(seq 1 15); do
            n="$(psql -h 127.0.0.1 -p 5433 -U postgres -d supersonic_platform -tAc \
              "select count(*) from fleet_nodes where agent_version = '$SHORT' and last_seen > now() - interval '3 minutes'")"
            echo "nodes running $SHORT: ${n:-0}"
            if [ "${n:-0}" -ge 1 ]; then ok=1; break; fi
            sleep 20
          done

          if [ "$ok" != "1" ]; then
            echo "::error::no node reported running $SHORT — leaving the rollout at 34%"
            exit 1
          fi

          printf '%s\n%s\n100\n' "$DIGEST" "$GITHUB_SHA" > current
          gcloud storage cp current \
            "gs://supersonic-static-assets/agent/current" \
            --cache-control="no-cache" \
            --project supersonic-deploy-prod
          echo "promoted $SHORT to the whole fleet"

      # Read back what was published rather than trusting that the upload
      # returned zero. The same reasoning as assertReleaseUploaded on the static
      # lane: an exit code says the step ran, not that it published.
      - name: Check the published binary matches what was built
        working-directory: services/fleet/agent
        run: |
          set -euo pipefail
          DIGEST="$(sha256sum supersonicd | cut -d' ' -f1)"
          gcloud storage cat "gs://supersonic-static-assets/agent/current" > published
          head -1 published | grep -qx "$DIGEST" || {
            echo "the pointer does not name the binary just built"; cat published; exit 1; }

          gcloud storage cp "gs://supersonic-static-assets/agent/$DIGEST/supersonicd" \
            downloaded --project supersonic-deploy-prod
          echo "$DIGEST  downloaded" | sha256sum -c -
