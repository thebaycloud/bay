# Push to main → production deploys itself, from GitHub.
#
# Deploying used to be two long gcloud commands someone had to remember, so a
# merged fix could sit dark for hours while everyone believed it was out.
#
# No service-account key lives in this repo or in GitHub secrets. GitHub hands
# Google a short-lived OIDC token instead, and Google trusts it only for pushes to
# this repository — see the attribute condition on the provider in docs/CUTOVER.md.
name: Deploy control plane

on:
  push:
    branches: [main]
  # Deploying the current main by hand, from the Actions tab, when a run needs redoing.
  workflow_dispatch:

# One deploy at a time, and never cancel one that is already running: a half-applied
# Cloud Run rollout is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required to mint the OIDC token; without it auth fails

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/540236122367/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: supersonic-deployer@supersonic-deploy-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # The schema moves with the code, in the same run, BEFORE it.
      #
      # It did not, and that is a hole this pipeline had rather than an oversight
      # of anyone's: `db/migrate.ts` was run by hand, so a commit whose code
      # needed a new table reached production before the table did. Measured on
      # 5 Aug — control plane 00270 shipped a query against fleet_process_faults
      # three minutes before a human ran the migration, and logged
      # `relation "fleet_process_faults" does not exist` every ten seconds in
      # between. The guard around that write is why it was three minutes of noise
      # and not an outage; the next migration is not required to be so lucky.
      #
      # BEFORE the build, so a migration that fails stops the deploy instead of
      # landing code whose schema is missing. That is the safe direction: every
      # file in db/ is additive and idempotent by rule, and migrate.ts applies
      # all of them in filename order on every run, so applying them ahead of the
      # code that uses them is exactly what the rule was written for.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Apply database migrations
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

          # The proxy authenticates with the same OIDC identity this job already
          # holds — google-github-actions/auth wrote ADC above — so no key and no
          # password reach this step for the CONNECTION. The password below is a
          # separate thing: it is Postgres's own, read from Secret Manager into
          # one command's environment and never written to a file or a log.
          curl -sSL -o cloud-sql-proxy             https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5433 supersonic-deploy-prod:us-central1:supersonic-shared-pg &

          # Wait for the listener rather than sleeping a guessed number of
          # seconds: a fixed sleep is either too short on a slow runner (the
          # deploy fails for no reason) or wasted on every run.
          # /dev/tcp rather than nc: it is bash itself, so this depends on
          # nothing the runner image has to keep providing.
          up=0
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/5433) 2>/dev/null; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then echo "cloud-sql-proxy never listened on 5433"; exit 1; fi

          PG_PASSWORD="$(gcloud secrets versions access latest \
            --secret supersonic-pg-password --project supersonic-deploy-prod)" \
            npx tsx db/migrate.ts

      # The build and the Cloud Run deploy both live in cloudbuild.yaml, so a hand-run
      # deploy and this one are the same thing and cannot drift apart.
      - name: Build and deploy
        run: |
          gcloud builds submit . \
            --project supersonic-deploy-prod \
            --config cloudbuild.yaml \
            --substitutions _TAG=${{ github.sha }}

      - name: Check the site answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://app.supersonic.cv/login)
          echo "app.supersonic.cv/login → $code"
          [ "$code" = "200" ]

      # The service and the JOB are the same image with different commands, and
      # only the service was ever checked. So an image that serves pages fine and
      # cannot start the deploy job — a pruned runtime dependency, a missing
      # binary — shipped green and broke the next customer deploy instead of this
      # build.
      #
      # A run id that is not on file is the cheapest possible exercise of the
      # whole path: claimRun finds nothing, deploy-job logs "nothing to do" and
      # exits 0, and getting that far means Node booted, tsx resolved and the
      # entire import tree of the pipeline loaded. Nothing is deployed.
      - name: Check the deploy job's image can start
        run: |
          set -euo pipefail
          gcloud run jobs execute supersonic-deploy-job \
            --region us-central1 --project supersonic-deploy-prod \
            --args=--import,tsx,scripts/deploy-job.ts,ci-smoke-not-a-real-run \
            --wait --quiet
          echo "the deploy job's image starts and reaches its own entry point"
